[package]
name = "rovacomd"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Behavior-preserving Rust port of the novacomd daemon"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rovacomd"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
nusb = "0.2.9"
sha1 = { version = "0.11.0", default-features = false }

# A panicking thread must end the daemon, as a crash ends the C daemon.
# With unwinding, a dead USB thread leaves its device listed but unusable.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
